<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D Model Viewer</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        overflow: hidden;
      }
      .hide {
        display: none !important;
      }
      #container {
        width: 100vw;
        height: 100vh;
        position: relative;
      }
      #canvas {
        width: 100%;
        height: 100%;
        display: block;
      }
      #controls {
        position: absolute;
        top: 20px;
        left: 20px;
        background: rgba(255, 255, 255, 0.95);
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        backdrop-filter: blur(10px);
        z-index: 10;
        min-width: 200px;
      }
      #fileInput {
        display: none;
      }
      .btn {
        background: #667eea;
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 14px;
        font-weight: 500;
        transition: all 0.3s;
        display: inline-block;
        margin-bottom: 15px;
        width: 100%;
      }
      .btn:hover {
        background: #5568d3;
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
      }
      .control-group {
        margin-bottom: 15px;
      }
      .control-group label {
        display: block;
        margin-bottom: 5px;
        font-size: 12px;
        font-weight: 600;
        color: #333;
      }
      input[type="range"] {
        width: 100%;
        margin-top: 5px;
      }
      input[type="color"] {
        width: 100%;
        height: 35px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
      }
      #info {
        position: absolute;
        bottom: 20px;
        left: 20px;
        background: rgba(255, 255, 255, 0.9);
        padding: 15px;
        border-radius: 8px;
        font-size: 12px;
        color: #666;
        max-width: 300px;
      }
      #loading {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: rgba(255, 255, 255, 0.95);
        padding: 30px 40px;
        border-radius: 12px;
        font-size: 16px;
        display: none;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        z-index: 100;
      }
      .spinner {
        border: 3px solid #f3f3f3;
        border-top: 3px solid #667eea;
        border-radius: 50%;
        width: 40px;
        height: 40px;
        animation: spin 1s linear infinite;
        margin: 0 auto 15px;
      }
      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
      .checkbox-group {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 10px;
      }
      .checkbox-group input[type="checkbox"] {
        width: 18px;
        height: 18px;
        cursor: pointer;
      }
      .checkbox-group label {
        margin: 0;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="container">
      <canvas id="canvas"></canvas>

      <div id="controls">
        <input type="file" id="fileInput" accept=".glb,.gltf" />
        <button
          class="btn"
          onclick="document.getElementById('fileInput').click()"
        >
          Load Model
        </button>

        <div class="control-group hide">
          <label>Background Color</label>
          <input type="color" id="bgColor" value="#1a1a2e" />
        </div>

        <div class="control-group hide">
          <label>Rotation Speed: <span id="rotSpeedValue">0.5</span></label>
          <input
            type="range"
            id="rotationSpeed"
            min="0"
            max="2"
            step="0.1"
            value="0.5"
          />
        </div>

        <div class="control-group">
          <label>Light Intensity: <span id="lightValue">3.0</span></label>
          <input
            type="range"
            id="lightIntensity"
            min="0"
            max="3"
            step="0.1"
            value="3"
          />
        </div>

        <div class="checkbox-group hide">
          <input type="checkbox" id="showGrid" checked />
          <label for="showGrid">Show Grid</label>
        </div>

        <div class="checkbox-group hide">
          <input type="checkbox" id="wireframe" />
          <label for="wireframe">Wireframe</label>
        </div>
      </div>

      <div id="loading">
        <div class="spinner"></div>
        <div>Loading model...</div>
      </div>

      <div id="info">
        <strong>Controls:</strong><br />
        • Left click + drag to rotate<br />
        • Right click + drag to pan<br />
        • Scroll to zoom<br />
        • Load your GLB/GLTF file to view
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
